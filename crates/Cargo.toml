[workspace]
resolver = "3"
members = ["cube-core", "cube-solver-rs", "tnoodle-lib-rs"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
cube-core = { path = "cube-core" }
wasm-bindgen = "=0.2.128"

[workspace.lints.clippy]
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3
