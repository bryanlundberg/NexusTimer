name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Typecheck packages and services
        run: pnpm --filter "./packages/**" --filter "./services/**" run typecheck

      - name: Test packages and services
        run: pnpm --filter "./packages/**" --filter "./services/**" run --if-present test

  realtime:
    name: Realtime gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/realtime

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_TEST_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/realtime/go.mod
          cache-dependency-path: services/realtime/go.sum

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  tnoodle-lib-rs:
    name: TNoodle scrambler crate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: packages/tnoodle-lib-rs/crate

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets --features oracle -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --lib --release -- -D warnings

      - name: Test
        run: cargo test
