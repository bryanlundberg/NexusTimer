name: Translation issue
description: Report a missing, wrong or hardcoded string, or propose translations for a locale.
title: 'i18n: '
labels: ['i18n']
body:
  - type: input
    id: locale
    attributes:
      label: Locale
      placeholder: es, de, fr, new locale, ...
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What is wrong and what should it say?
      description: Include the screen or i18n key if you know it. For bulk updates you can paste or attach the JSON.
      placeholder: |
        Screen: Settings > Profile
        Current: "Guardar cambio"
        Suggested: "Guardar cambios"
    validations:
      required: true
