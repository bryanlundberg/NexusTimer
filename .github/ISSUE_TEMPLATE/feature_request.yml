name: Feature request
description: Suggest a new feature or improvement for NexusTimer.
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: The problem you are trying to solve and the behaviour you have in mind. Mockups or references welcome.
      placeholder: I practise OH and I cannot filter my solves by hand, so I have to ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Timer
        - Solves / Manage solves
        - Statistics / Deep stats
        - Cubes / Collections
        - Account / Auth
        - Backups / Sync
        - Multiplayer (Nexus Connect / Free play)
        - Trainer
        - Algorithms
        - Leaderboards / Community / Profiles
        - Settings
        - Internationalization (i18n)
        - PWA / Service Worker
        - Other
    validations:
      required: true
