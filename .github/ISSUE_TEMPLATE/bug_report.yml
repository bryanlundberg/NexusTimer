name: Bug report
description: Report a bug in NexusTimer.
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots or recordings help a lot.
      placeholder: |
        I clicked "Save solve" on the timer page and the solve was not saved.
        Steps: 1) Start a solve 2) Stop the timer 3) Reload the page
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Timer
        - Solves / Manage solves
        - Statistics / Deep stats
        - Cubes / Collections
        - Account / Auth
        - Backups / Sync
        - Multiplayer (Nexus Connect / Free play)
        - Trainer
        - Algorithms
        - Leaderboards / Community / Profiles
        - Settings
        - Internationalization (i18n)
        - PWA / Service Worker
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Chrome 131 on Windows 11, Safari on iPhone 15, ...
    validations:
      required: false
