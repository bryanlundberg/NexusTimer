name: Algorithm suggestion or correction
description: Suggest a new algorithm or report an incorrect one.
title: 'algs: '
labels: ['algorithms']
body:
  - type: input
    id: case
    attributes:
      label: Puzzle, method and case
      placeholder: 3x3 / PLL / T-Perm
    validations:
      required: true

  - type: input
    id: proposed
    attributes:
      label: Proposed algorithm
      description: Standard WCA notation.
      placeholder: R U R' U' R' F R2 U' R' U' R U R' F'
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why / current algorithm
      description: What the app shows today (if it is a correction) and why your version is better. A source link is welcome.
    validations:
      required: false
