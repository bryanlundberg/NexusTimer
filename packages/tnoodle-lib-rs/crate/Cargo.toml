[package]
name = "tnoodle-lib-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
oracle = []

[dependencies]
wasm-bindgen = "=0.2.128"
getrandom = "0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[lints.clippy]
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3

[[example]]
name = "dump"
required-features = ["oracle"]
